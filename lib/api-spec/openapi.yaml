openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: TRIXHUB Affiliation Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: referrals
  - name: balances
  - name: withdrawals
  - name: tasks
  - name: config
  - name: currency

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email or phone already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/activate:
    post:
      operationId: activateAccount
      tags: [auth]
      summary: Activate account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateBody"
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/referrer/{code}:
    get:
      operationId: getReferrer
      tags: [auth]
      summary: Get referrer info by referral code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Referrer info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferrerInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    patch:
      operationId: updateProfile
      tags: [users]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/dashboard:
    get:
      operationId: getDashboard
      tags: [users]
      summary: Get dashboard data
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /users/me/preferred-currency:
    patch:
      operationId: updatePreferredCurrency
      tags: [users]
      summary: Update preferred currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrencyBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/theme:
    patch:
      operationId: updateTheme
      tags: [users]
      summary: Update theme preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThemeBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /referrals/team:
    get:
      operationId: getTeam
      tags: [referrals]
      summary: Get full team (all levels)
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"

  /referrals/level/{level}:
    get:
      operationId: getReferralsByLevel
      tags: [referrals]
      summary: Get referrals by level
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Referrals by level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralLevelResponse"

  /referrals/activate-child/{childId}:
    post:
      operationId: activateChild
      tags: [referrals]
      summary: Active un filleul N1 inactif via solde dépôt ou parrainage
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateChildBody"
      responses:
        "200":
          description: Filleul activé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateChildResponse"
        "402":
          description: Solde insuffisant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Pas votre filleul direct
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Filleul introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /referrals/activity:
    get:
      operationId: getReferralActivity
      tags: [referrals]
      summary: Get recent referral activity feed
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /balances:
    get:
      operationId: getBalances
      tags: [balances]
      summary: Get all balances
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSummary"

  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List withdrawal requests
      responses:
        "200":
          description: Withdrawals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"
    post:
      operationId: requestWithdrawal
      tags: [withdrawals]
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalBody"
      responses:
        "201":
          description: Withdrawal requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks/missions
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark task as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /config/platform:
    get:
      operationId: getPlatformConfig
      tags: [config]
      summary: Get platform config
      responses:
        "200":
          description: Platform config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformConfig"

  /config/payout-methods:
    get:
      operationId: getPayoutMethods
      tags: [config]
      summary: Get available payout methods for the user's country (from AccountPE)
      responses:
        "200":
          description: Payout methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutMethodsResponse"

  /currency/rates:
    get:
      operationId: getCurrencyRates
      tags: [currency]
      summary: Get currency exchange rates
      responses:
        "200":
          description: Currency rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyRates"

  /activities/weekly-status:
    get:
      operationId: getWeeklyStatus
      tags: [activities]
      summary: Get weekly points status (cap quotidien + hebdo, jour, conversion)
      responses:
        "200":
          description: Weekly status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyStatus"

  /activities/quiz/start:
    post:
      operationId: startQuiz
      tags: [activities]
      summary: Generate a new 5-question AI quiz session
      responses:
        "200":
          description: Quiz session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "429":
          description: Daily or weekly cap reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /activities/quiz/{sessionId}/submit:
    post:
      operationId: submitQuiz
      tags: [activities]
      summary: Submit quiz answers and award points
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmitBody"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"

  /activities/surprise/submit:
    post:
      tags: [activities]
      summary: Submit WhatsApp status screenshot for Surprise activity (Friday only)
      operationId: submitSurpriseActivity
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageBase64:
                  type: string
                  description: Base64-encoded screenshot image
                mimeType:
                  type: string
                  description: "image/jpeg | image/png | image/webp"
              required: [imageBase64, mimeType]
      responses:
        "200":
          description: Screenshot processed and points awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurpriseSubmitResult"
        "400":
          description: Invalid request or already done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /activities/discovery/start:
    post:
      tags: [activities]
      summary: Start a discovery offer session
      operationId: startDiscoverySession
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offerId:
                  type: string
              required: [offerId]
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                required: [sessionId]
        "400":
          description: Already done or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /activities/discovery/claim:
    post:
      tags: [activities]
      summary: Claim 30 pts after 60s discovery
      operationId: claimDiscoveryPoints
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
              required: [sessionId]
      responses:
        "200":
          description: Points awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryClaimResult"
        "400":
          description: Session invalid or timer not elapsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /activities/video/start:
    post:
      tags: [activities]
      summary: Start a video watch session
      operationId: startVideoSession
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                videoId:
                  type: string
              required: [videoId]
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                required: [sessionId]

  /activities/video/claim:
    post:
      tags: [activities]
      summary: Claim 20 pts after watching 45s
      operationId: claimVideoPoints
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
              required: [sessionId]
      responses:
        "200":
          description: Points awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoClaimResult"

  /activities/convert:
    post:
      operationId: convertWeeklyPoints
      tags: [activities]
      summary: Convert 700 weekly points to 700 FCFA (Sunday only)
      responses:
        "200":
          description: Conversion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResult"
        "400":
          description: Cannot convert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /withdrawals/activity:
    get:
      operationId: listActivityWithdrawals
      tags: [activities]
      summary: List activity-balance withdrawal requests for current user
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityWithdrawal"
    post:
      operationId: requestActivityWithdrawal
      tags: [activities]
      summary: Request a withdrawal from activity balance (min 3500 FCFA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityWithdrawalBody"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityWithdrawal"

  /activities/schedule:
    get:
      tags: [activities]
      summary: 7-day activity schedule + today's availability
      operationId: getActivitiesSchedule
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"

  /admin/activities/schedule:
    post:
      tags: [admin]
      summary: Admin — schedule an activity for a date
      operationId: adminCreateActivitySchedule
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityScheduleBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityScheduleEntry"

  /admin/activities/schedule/{id}:
    patch:
      tags: [admin]
      summary: Admin — update schedule entry
      operationId: adminUpdateActivitySchedule
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isEnabled:
                  type: boolean
                notes:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityScheduleEntry"
    delete:
      tags: [admin]
      summary: Admin — delete schedule entry
      operationId: adminDeleteActivitySchedule
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    RegisterBody:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        country:
          type: string
        password:
          type: string
        referralCode:
          type: ["string", "null"]
      required: [email, phone, country, password]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    ActivateBody:
      type: object
      properties:
        paymentMethod:
          type: string
        paymentReference:
          type: string
        currency:
          type: string
      required: [paymentMethod, paymentReference]

    UpdateProfileBody:
      type: object
      properties:
        displayName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]

    UpdateCurrencyBody:
      type: object
      properties:
        currency:
          type: string
      required: [currency]

    UpdateThemeBody:
      type: object
      properties:
        theme:
          type: string
      required: [theme]

    ReferrerInfo:
      type: object
      properties:
        displayName:
          type: string
        referralCode:
          type: string
        country:
          type: string
      required: [displayName, referralCode]

    User:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        email:
          type: string
        phone:
          type: string
        country:
          type: string
        isActivated:
          type: boolean
        referralCode:
          type: string
        referredByCode:
          type: ["string", "null"]
        preferredCurrency:
          type: string
        themePreference:
          type: string
        avatarUrl:
          type: ["string", "null"]
          description: Chemin Object Storage de la photo de profil (null si non définie)
        createdAt:
          type: string
      required: [id, displayName, email, phone, country, isActivated, referralCode, preferredCurrency, themePreference, createdAt]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    Dashboard:
      type: object
      properties:
        totalBalance:
          type: number
        referralBalance:
          type: number
        taskBalance:
          type: number
        activityBalance:
          type: number
        bonusBalance:
          type: number
        depositBalance:
          type: number
        withdrawnAmount:
          type: number
        spentAmount:
          type: number
        inactiveBalance:
          type: number
        totalReferrals:
          type: integer
        activeReferrals:
          type: integer
        inactiveReferrals:
          type: integer
        level1Count:
          type: integer
        level2Count:
          type: integer
        level3Count:
          type: integer
        pendingWithdrawals:
          type: integer
        dailyBonusClaimed:
          type: boolean
          description: "true si le bonus quotidien a été crédité lors de cet appel"
        dailyBonusAmount:
          type: number
        currency:
          type: string
        exchangeRate:
          type: number
        sponsor:
          nullable: true
          type: object
          properties:
            name:
              type: string
            referralCode:
              type: string
          required: [name, referralCode]
      required: [totalBalance, referralBalance, taskBalance, bonusBalance, depositBalance, withdrawnAmount, spentAmount, inactiveBalance, totalReferrals, activeReferrals, inactiveReferrals, level1Count, level2Count, level3Count, pendingWithdrawals, dailyBonusClaimed, dailyBonusAmount, currency, exchangeRate]

    ReferralUser:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        country:
          type: string
        isActivated:
          type: boolean
        joinedAt:
          type: string
        level:
          type: integer
      required: [id, displayName, country, isActivated, joinedAt, level]

    TeamResponse:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        members:
          type: array
          items:
            $ref: "#/components/schemas/ReferralUser"
      required: [total, active, inactive, members]

    ReferralLevelResponse:
      type: object
      properties:
        level:
          type: integer
        commission:
          type: number
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        members:
          type: array
          items:
            $ref: "#/components/schemas/ReferralUser"
      required: [level, commission, total, active, inactive, members]

    BalanceSummary:
      type: object
      properties:
        totalBalance:
          type: number
        referralBalance:
          type: number
        taskBalance:
          type: number
        activityBalance:
          type: number
        bonusBalance:
          type: number
        depositBalance:
          type: number
        inactiveBalance:
          type: number
        withdrawnAmount:
          type: number
        spentAmount:
          type: number
        minimumWithdrawal:
          type: number
        currency:
          type: string
        exchangeRate:
          type: number
      required: [totalBalance, referralBalance, taskBalance, bonusBalance, depositBalance, inactiveBalance, withdrawnAmount, spentAmount, minimumWithdrawal, currency, exchangeRate]

    ActivateChildBody:
      type: object
      properties:
        source:
          type: string
          description: "deposit (3600) ou referral (4100=3600+500 frais)"
      required: [source]

    ActivateChildResponse:
      type: object
      properties:
        success:
          type: boolean
        childId:
          type: integer
        cost:
          type: number
        source:
          type: string
        message:
          type: string
      required: [success, childId, cost, source, message]

    WithdrawalBody:
      type: object
      properties:
        amount:
          type: number
        method:
          type: string
          description: "ID méthode de paiement AccountPE (ex: mtn_cm, orange_cm) ou id interne pour tâches"
        accountNumber:
          type: string
          description: "Numéro Mobile Money du bénéficiaire"
        accountName:
          type: string
          description: "Nom du titulaire du compte Mobile Money"
        source:
          type: string
          description: "referral or task"
        whatsappNumber:
          type: string
          description: "Numéro WhatsApp du membre (obligatoire pour retraits parrainage)"
        payoutMethod:
          type: string
          description: "ID AccountPE de la méthode payout (ex: mtn_cm) — obligatoire pour retraits parrainage"
        feeMode:
          type: string
          enum: [from_amount, from_balance]
          description: "Mode de paiement des frais: 'from_amount' (frais déduits du montant reçu) ou 'from_balance' (frais prélevés séparément sur le solde parrainage)"
      required: [amount, method, accountNumber, accountName, source]

    Withdrawal:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
        method:
          type: string
        accountNumber:
          type: string
        accountName:
          type: string
        whatsappNumber:
          type: ["string", "null"]
        source:
          type: string
        status:
          type: string
        feeMode:
          type: ["string", "null"]
