kind = "web"
previewPath = "/"
title = "TRIXHUB - Plateforme d'Affiliation"
version = "1.0.0"
id = "artifacts/trixhub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25292

[services.development]
run = "pnpm --filter @workspace/trixhub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trixhub", "run", "build" ]
publicDir = "artifacts/trixhub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25292"
BASE_PATH = "/"
